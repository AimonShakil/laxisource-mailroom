[project]
name = "laxisource-mailroom"
version = "0.1.0"
description = "Laxisource mailroom: a learning project for programming fundamentals (PRIMM-AI+)."
readme = "README.md"
authors = [
    { name = "Aimon Shakeel", email = "aimon.ipas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["main.py", "mailroom.py", "tests"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
